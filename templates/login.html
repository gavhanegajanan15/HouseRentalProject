{% extends 'base.html' %}
{% load static %}

{% block title %}Login | HouseRent{% endblock %}

{% block content %}

<section class="login-section">

    <div class="container">

        <div class="row login-wrapper shadow-lg">

            <!-- Left Side -->
            <div class="col-lg-6 login-image d-none d-lg-block">

                <img src="{% static 'images/properties/house_01.jpg' %}"
                     class="img-fluid h-100 w-100"
                     style="object-fit:cover;"
                     alt="House">

            </div>

            <!-- Right Side -->
            <div class="col-lg-6">

                <div class="login-card">

                    <div class="text-center mb-4">

                        <i class="bi bi-door-open-fill login-icon"></i>

                        <h2 class="fw-bold mt-3">Welcome Back</h2>

                        <p class="text-muted">
                            Login to continue to HouseRent
                        </p>

                    </div>

                    <form method="POST">
                        {% csrf_token %}    

                        <div class="mb-3">

                            <label class="form-label">Email Address</label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Password</label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required>

                        </div>

                        <div class="d-flex justify-content-between mb-4">

                            <div>

                                <input type="checkbox">

                                Remember Me

                            </div>

                            <a href="#">Forgot Password?</a>

                        </div>

                        <button type="submit" class="btn btn-primary w-100">

                            Login

                        </button>

                    </form>

                    <hr>

                    <p class="text-center mb-0">

                        Don't have an account?

                        <a href="#">Create Account</a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
